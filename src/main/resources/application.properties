# ============================================================
# Spring Boot Application Properties
# ============================================================

# Server port (mặc định: 8081)
server.port=8081

# Thymeleaf configuration
# - prefix: thư mục chứa template
# - suffix: phần mở rộng file template
# - cache: tắt cache khi phát triển (bật lại khi deploy)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Logging level
# Dat DEBUG neu ban muon quan sat chi tiet qua trinh flow execution.
logging.level.org.springframework.webflow=INFO
logging.level.com.example.webflow=INFO

# Application name
spring.application.name=demo-spring-webflow
